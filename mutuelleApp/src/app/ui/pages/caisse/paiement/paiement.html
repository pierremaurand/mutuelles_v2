<div class="container" *ngIf="echeancier$ | async as echeancier">
  <div class="d-flex justify-content-between align-items-center">
    <h5>Echéances</h5>
    <div class="row g-3 align-items-center">
      <div class="col-auto">
        <input
          class="form-check-input"
          type="checkbox"
          value=""
          id="flexCheckDefault"
          (change)="onCheckAll(echeancier, $event)"
          [disabled]="datePaiementCtrl.value == ''"
        />
      </div>
      <div class="col-auto">
        <label for="flexCheckDefault">Tous cocher/décocher</label>
      </div>
      <div class="col-auto">
        <label for="dateEcheance" class="col-form-label">Date échéance</label>
      </div>
      <div class="col-auto">
        <input
          type="date"
          class="form-control"
          id="dateEcheance"
          name="dateEcheance"
          [formControl]="datePaiementCtrl"
          [ngClass]="{
            'is-invalid': !datePaiementCtrl.valid,
            'is-valid': datePaiementCtrl.valid
          }"
        />
      </div>
    </div>
  </div>
  <hr />
  <form [formGroup]="request" (ngSubmit)="submitForm()">
    <div class="row">
      <div class="col">
        <div class="card shadow">
          <div class="card-body liste">
            <app-ligne-echeance
              *ngFor="let echeance of echeancier; let i = index"
              [item]="{i,checked:false,echeance}"
            ></app-ligne-echeance>
            <table class="table table-striped table-sm table-bordered">
              <tbody>
                <tr *ngFor="let echeance of echeancier; let i = index">
                  <td class="text-center">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      [checked]="items[i].checked"
                      (change)="onCheck(i, echeance, $event)"
                      [disabled]="!datePaiementCtrl.valid"
                    />
                  </td>
                  <td class="text-center">
                    {{ echeance.dateEcheance | date : "dd/MM/yyyy" }}
                  </td>
                  <td class="text-end">
                    {{ echeance.montantInterets + echeance.montantCapital |
                    number }} FCFA
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <hr />
    <div class="d-flex justify-content-end gap-1">
      <button
        class="btn btn-primary"
        type="submit"
        [disabled]="!request.valid || lines.length === 0"
      >
        <i class="fa-solid fa-floppy-disk"></i> Enregistrer
      </button>
      <button class="btn btn-danger" type="button" (click)="onCancel()">
        <i class="fa-solid fa-xmark"></i> Annuler
      </button>
    </div>
  </form>
</div>
