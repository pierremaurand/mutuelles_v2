<div class="container">
  @if(caisse$ | async; as caisse){
  <div class="d-flex justify-content-between p-2">
    <h3 class="titre">Accueil caisse: {{caisse.nom | uppercase}}</h3>
    <button class="btn btn-danger">Clôturer</button>
  </div>
  <hr />
  <div class="row">
    @if(mouvements$ | async; as mouvements){
    <div class="col-md-8 liste">
      @for(mouvement of mouvements; track mouvement.id){
      <app-ligne-mouvement
        [mouvement]="mouvement"
        (selectEvent)="onSelected($event)"
      />
      }
    </div>
    }
    <div class="col-md-4">
      @if(selectedMouvement){
      <app-card-mouvement [mouvement]="selectedMouvement" [showAction]="true" />
      }
    </div>
  </div>
  }
</div>
