<div class="container">
  <div class="d-flex justify-content-between">
    <h1 class="h3">Les credits</h1>
    <button class="btn btn-primary" type="button" (click)="add()">
      Ajouter un credit
    </button>
  </div>
  <hr />
  <div class="row" *ngIf="credits$ | async as credits">
    <div class="col-md-2 mb-3" *ngFor="let credit of credits">
      <app-card
        [credit]="credit"
        [membre]="getMembreById(credit.membreId)"
      ></app-card>
    </div>
    <div class="col" *ngIf="credits.length == 0">
      <h2 class="text-center">Aucune credit n'a été trouvé dans la base</h2>
    </div>
  </div>
</div>
