<div class="container">
  <div class="d-flex justify-content-between">
    <h1 class="h3">Les cotisations</h1>
    <button class="btn btn-primary" type="button" (click)="add()">
      Ajouter une cotisation
    </button>
  </div>
  <hr />
  <div
    class="d-flex justify-content-center flex-wrap gap-2 mb-3 liste"
    *ngIf="cotisations$ | async as cotisations"
  >
    <app-card
      *ngFor="let cotisation of cotisations"
      [cotisation]="cotisation"
    ></app-card>
    <h2 *ngIf="cotisations.length == 0" class="text-center">
      Aucune cotisation n'a été trouvé dans la base
    </h2>
  </div>
</div>
