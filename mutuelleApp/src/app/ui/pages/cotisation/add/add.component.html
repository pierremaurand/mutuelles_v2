<div class="container" *ngIf="membres$ | async as membres">
  <div class="d-flex justify-content-between">
    <h1 class="h3">Nouvelles cotisations</h1>
  </div>
  <hr />
  <div class="d-flex gap-1">
    <div class="mb-3" *ngIf="agences$ | async as agences">
      <label for="agenceId" class="form-label">Agence</label>
      <select
        name="agenceId"
        id="agenceId"
        class="form-select"
        [formControl]="agenceCtrl"
      >
        <option value=""></option>
        <option *ngFor="let agence of agences" value="{{ agence.id }}">
          {{ agence.nom | uppercase }}
        </option>
      </select>
    </div>
    <div class="mb-3">
      <label for="dateCotisaiton" class="form-label"
        >Date de la cotisation</label
      >
      <input
        type="date"
        name="dateCotisation"
        id="dateCotisation"
        class="form-control"
        [formControl]="dateCotisationCtrl"
      />
    </div>
  </div>
  <form [formGroup]="request" (ngSubmit)="submitForm()">
    <div formArrayName="lines">
      <div
        class="row"
        *ngFor="let membre of membres; let i = index"
        [formGroupName]="i"
      >
        <div class="col-md-6">
          <label for="nom-{{ i }}">Nom du membre</label>
          <input
            type="text"
            disabled
            value="{{ membre.nom }}"
            class="form-control"
            id="nom-{{ i }}"
            name="nom-{{ i }}"
          />
        </div>
        <div class="col-md-6">
          <label for="montant-{{ i }}">Montant</label>
          <input
            type="number"
            class="form-control"
            name="montant-{{ i }}"
            id="montant-{{ i }}"
            formControlName="montant"
          />
        </div>
      </div>
    </div>
    <hr />
    <div class="d-flex justify-content-end gap-1">
      <button class="btn btn-primary" type="submit">
        <i class="fa-solid fa-floppy-disk"></i> Enregistrer
      </button>
      <button class="btn btn-danger" type="button" (click)="onCancel()">
        <i class="fa-solid fa-xmark"></i> Annuler
      </button>
    </div>
  </form>
</div>
