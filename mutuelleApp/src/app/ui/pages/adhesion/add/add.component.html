<div class="container" *ngIf="membres$ | async as membres">
  <div class="d-flex justify-content-between">
    <h1 class="h3">Nouvelles adhésions</h1>
    <div class="row g-3 align-items-center">
      <div class="col-auto">
        <label for="date" class="col-form-label">Date d'adhésion</label>
      </div>
      <div class="col-auto">
        <input
          type="date"
          class="form-control"
          id="date"
          name="date"
          [formControl]="dateAdhesionCtrl"
        />
      </div>
    </div>
  </div>
  <hr />
  <form [formGroup]="request" (ngSubmit)="submitForm()">
    <div formArrayName="lines" class="row liste">
      @for(membre of membres; track membre.id){
      <div class="col-md-6">
        <app-ligne [adhesion]="membre" />
      </div>
      }
    </div>
    <hr />
    <div class="d-flex justify-content-end gap-1">
      <button class="btn btn-primary" type="submit" [disabled]="!request.valid">
        <i class="fa-solid fa-floppy-disk"></i> Enregistrer
      </button>
      <button class="btn btn-danger" type="button" (click)="onCancel()">
        <i class="fa-solid fa-xmark"></i> Annuler
      </button>
    </div>
  </form>
</div>
