<div class="container">
  <div class="d-flex justify-content-between">
    <h1 class="h3">Les adhesions</h1>
    <button class="btn btn-primary" type="button" (click)="add()">
      Ajouter une adhesion
    </button>
  </div>
  <hr />
  <div class="row" *ngIf="adhesions$ | async as adhesions">
    <div class="col-md-2 mb-3" *ngFor="let adhesion of adhesions">
      <app-card [adhesion]="adhesion"></app-card>
    </div>
    <div class="col" *ngIf="adhesions.length == 0">
      <h2 class="text-center">Aucune adhesion n'a été trouvé dans la base</h2>
    </div>
  </div>
</div>
