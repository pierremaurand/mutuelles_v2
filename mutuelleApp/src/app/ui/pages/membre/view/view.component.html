<div class="container">
  <div class="d-flex justify-content-between">
    <div class="d-flex justify-content-start gap-2 p-2">
      <button
        class="btn btn-primary rounded-circle shadow-sm"
        (click)="onBack()"
      >
        <i class="fa fa-arrow-left"></i>
      </button>
      <h3 class="titre">Infos membre</h3>
    </div>

    <div class="d-flex justify-content-end gap-1"></div>
  </div>
  <div class="row">
    <div class="col-md-3">
      @if(membre$ | async; as membre){
      <app-membre-card
        [membre]="membre"
        [showImageChanged]="true"
        [showActivated]="true"
        (onActivateEvent)="activateMember($event)"
        (onImageChangeEvent)="changeImageMember($event)"
      />}
    </div>
    <div class="col-md-9">
      <router-outlet />
    </div>
  </div>
</div>
