<div class="container" *ngIf="membre$ | async as membre">
  <div class="d-flex justify-content-between">
    <div class="d-flex justify-content-start gap-2">
      <button
        class="btn btn-primary rounded-circle shadow-sm"
        (click)="onBack()"
      >
        <i class="fa fa-arrow-left"></i>
      </button>
      <h3>Infos membre</h3>
    </div>

    <div class="d-flex justify-content-end gap-1">
      <!-- <button
        type="button"
        class="btn btn-success"
        (click)="onAnticipePaiement(avance.id)"
        *ngIf="avance.nombreEcheanceImpaye"
      >
        <i class="fa-solid fa-list-check"></i>
      </button> -->
    </div>
  </div>
  <hr />
  <div class="row">
    <div class="col-md-3">
      <div class="card shadow">
        <div class="card-body">
          <div class="d-flex justify-content-center">
            <img
              [src]="membre.photo ? baseUrl + '/' + membre.photo : photo"
              class="rounded-circle img-thumbnail"
              alt="image membre"
              width="200"
            />
          </div>
          <div class="row">
            <h6 class="text-center text-truncate">
              {{ membre.nom | uppercase }}
            </h6>
            <h6 class="text-center text-truncate">
              {{ afficheSexe(membre.sexe) }}
            </h6>
            <h6 class="text-center text-truncate">
              {{ membre.dateNaissance | date : "dd/MM/yyyy" }},
              {{ membre.lieuNaissance }}
            </h6>
          </div>
          <div class="d-flex justify-content-center gap-1">
            @if(membre.estActif) {
            <button
              class="btn btn-danger rounded-circle"
              type="button"
              (click)="onActivated(membre)"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
            } @else {
            <button
              class="btn btn-success rounded-circle"
              type="button"
              (click)="onActivated(membre)"
            >
              <i class="fa-solid fa-check"></i>
            </button>
            }
            <button
              type="button"
              class="btn btn-secondary rounded-circle"
              (click)="onChangeImage(membre.id)"
            >
              <i class="fa-solid fa-camera"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-9">
      <router-outlet />
    </div>
  </div>
</div>
