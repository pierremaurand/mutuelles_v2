<div
  class="card shadow membre-card border-{{
    membre.estActif ? 'success' : 'danger'
  }}"
>
  <div class="card-img-wrapper">
    <img
      [src]="
        membre.photo
          ? baseUrl + '/' + membre.photo
          : './assets/images/default_man.jpg'
      "
      class="card-img-top"
      alt="photo membre"
    />
    <ul class="list-inline text-center membre-icons animate">
      <!-- <li class="list-inline-item">
        @if(membre.estActif) {
        <button
          class="btn btn-danger form-control btn-sm"
          type="button"
          (click)="updateEtatUser()"
        >
          <i class="fa-solid fa-user-xmark"></i>
        </button>
        } @else {
        <button
          class="btn btn-success form-control btn-sm"
          type="button"
          (click)="updateEtatU()"
        >
          <i class="fa-solid fa-user-check"></i>
        </button>
        }
      </li> -->
      <li class="list-inline-item">
        <button
          class="btn btn-warning form-control btn-sm"
          type="button"
          (click)="onEdit()"
        >
          <i class="fa-solid fa-pen-to-square"></i>
        </button>
      </li>

      <li class="list-inline-item">
        <button
          class="btn btn-primary form-control btn-sm"
          type="button"
          (click)="onView()"
        >
          <i class="fa-solid fa-eye"></i>
        </button>
      </li>
    </ul>
  </div>

  <div class="card-body">
    <h6 class="text-center text-truncate">{{ membre.nom | uppercase }}</h6>
    <h6 class="text-center text-truncate">
      {{ membre.nomAgence | uppercase }}
    </h6>
    <h6 class="text-center text-success text-truncate">
      {{ membre.montantCotise | number }} FCFA
    </h6>
    <h6 class="text-center text-primary text-truncate">
      {{ membre.solde | number }} FCFA
    </h6>
  </div>
</div>
