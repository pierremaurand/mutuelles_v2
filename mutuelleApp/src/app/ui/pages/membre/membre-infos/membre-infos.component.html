<div class="row">
  <div class="col-md-6 mb-3" *ngIf="membre$ | async as membre">
    <div class="card shadow">
      <div class="card-header">
        <h5 class="card-title">Informations du membre</h5>
      </div>
      <div class="card-body">
        <table class="table table-striped table-bordered table-sm">
          <tbody>
            <tr>
              <th>Nom</th>
              <td>{{ membre.nom | uppercase }}</td>
            </tr>
            <tr>
              <th>Sexe</th>
              <td>{{ afficheSexe(membre.sexe) }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="col-md-6 mb-3"></div>
  <div class="col-md-6 mb-3"></div>
  <div class="col-md-6 mb-3"></div>
  <div class="col-md-6 mb-3"></div>
  <div class="col-md-6 mb-3"></div>
</div>
