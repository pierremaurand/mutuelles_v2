<div class="container">
  <h5>Infos avance</h5>
  <hr />
  <form [formGroup]="request" (ngSubmit)="submitForm()">
    <div class="row">
      <div class="col-md-3">
        <app-infos-pret
          [montant]="montantCapitalCtrl.value"
          [duree]="dureeCtrl.value"
        ></app-infos-pret>
      </div>
      <div class="col-md-9">
        <div class="card shadow">
          <div class="card-body">
            <div class="row">
              <div class="col-md-6 mb-3" *ngIf="agences$ | async as agences">
                <label for="agenceId" class="form-label">Agence</label>
                <select
                  name="agenceId"
                  id="agenceId"
                  class="form-select"
                  [formControl]="agenceCtrl"
                >
                  <option value=""></option>
                  <option *ngFor="let agence of agences" [value]="agence.id">
                    {{ agence.nom | uppercase }}
                  </option>
                </select>
              </div>
              <div class="col-md-6 mb-3" *ngIf="membres$ | async as membres">
                <label for="membreId" class="form-label">Membre</label>
                <select
                  name="membreId"
                  id="membreId"
                  class="form-select"
                  formControlName="membreId"
                >
                  <option value=""></option>
                  <option *ngFor="let membre of membres" [value]="membre.id">
                    {{ membre.nom | uppercase }}
                  </option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="montantCapital" class="form-label">Montant</label>
                <input
                  type="number"
                  name="montantCapital"
                  id="montantCapital"
                  class="form-control"
                  formControlName="montantCapital"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label for="duree" class="form-label">Durée</label>
                <input
                  type="number"
                  name="duree"
                  id="duree"
                  class="form-control"
                  formControlName="duree"
                />
              </div>
              <div class="col-md-4 mb-3">
                <label for="dateDemande" class="form-label"
                  >Date de la demande</label
                >
                <input
                  type="date"
                  name="dateDemande"
                  id="dateDemande"
                  class="form-control"
                  formControlName="dateDemande"
                />
              </div>
              <div class="col-md-4 mb-3">
                <label for="dateDecaissement" class="form-label"
                  >Date décaissement</label
                >
                <input
                  type="date"
                  name="dateDecaissement"
                  id="dateDecaissement"
                  class="form-control"
                  formControlName="dateDecaissement"
                />
              </div>
              <div class="col-md-4 mb-3">
                <label for="differe" class="form-label">Différer de</label>
                <input
                  type="number"
                  name="differe"
                  id="differe"
                  class="form-control"
                  [formControl]="differeCtrl"
                />
              </div>
            </div>
          </div>
        </div>
        <hr />
        <div class="row">
          <div class="col echeancier">
            <app-echeancier-pret
              [echeancier]="echeancier"
              [nbrEcheances]="dureeCtrl.value"
              [echeancierCredit]="false"
            ></app-echeancier-pret>
          </div>
        </div>
      </div>
    </div>

    <hr />
    <div class="d-flex justify-content-end gap-1">
      <button class="btn btn-primary" type="submit">
        <i class="fa-solid fa-floppy-disk"></i> Enregistrer
      </button>
      <button class="btn btn-danger" type="button" (click)="onCancel()">
        <i class="fa-solid fa-xmark"></i> Annuler
      </button>
    </div>
  </form>
</div>
