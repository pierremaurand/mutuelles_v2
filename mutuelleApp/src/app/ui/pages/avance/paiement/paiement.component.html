<div class="container" *ngIf="echeancier$ | async as echeancier">
  <h5>Infos crédit</h5>
  <hr />
  <form [formGroup]="request" (ngSubmit)="submitForm()">
    <div class="row">
      <div class="col">
        <div class="card shadow">
          <div class="card-header">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value=""
                id="flexCheckDefault"
                (change)="onCheckAll(echeancier, $event)"
              />
              <label class="form-check-label" for="flexCheckDefault">
                Tout cocher / Tout décocher
              </label>
            </div>
          </div>
          <div class="card-body echeancier">
            <table class="table table-striped table-sm table-bordered">
              <thead>
                <tr>
                  <th class="text-center">#</th>
                  <th class="text-center">Date</th>
                  <th class="text-center">Montant échéance</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let echeance of echeancier; let i = index">
                  <td class="text-center">
                    <div>
                      <input
                        class="form-check-input"
                        type="checkbox"
                        [checked]="items[i].checked"
                        (change)="onCheck(i, echeance, $event)"
                      />
                    </div>
                  </td>
                  <td class="text-center">
                    {{ echeance.dateEcheance | date : "dd/MM/yyyy" }}
                  </td>
                  <td class="text-end">
                    {{
                      echeance.montantInterets + echeance.montantCapital
                        | number
                    }}
                    FCFA
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <hr />
    <div class="d-flex justify-content-end gap-1">
      <button
        class="btn btn-primary"
        type="submit"
        [disabled]="lines.value.length === 0"
      >
        <i class="fa-solid fa-floppy-disk"></i> Enregistrer
      </button>
      <button class="btn btn-danger" type="button" (click)="onCancel()">
        <i class="fa-solid fa-xmark"></i> Annuler
      </button>
    </div>
  </form>
</div>
