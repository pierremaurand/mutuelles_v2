@if(avance$ | async; as avance){
<div class="container">
  <div class="d-flex justify-content-between">
    <div class="d-flex justify-content-start gap-2">
      <button
        class="btn btn-primary rounded-circle shadow-sm"
        (click)="onBack()"
      >
        <i class="fa fa-arrow-left"></i>
      </button>
      <h3>Infos avance</h3>
    </div>

    <div class="d-flex justify-content-end gap-1">
      <button
        type="button"
        class="btn btn-success"
        (click)="onAnticipePaiement(avance.id ?? 0)"
        *ngIf="avance.nombreEcheanceImpaye"
      >
        <i class="fa-solid fa-list-check"></i>
      </button>
    </div>
  </div>
  <hr />
  <div class="row">
    <div class="col-md-3">
      <app-membre-card [membre]="avance" [showInfosMembre]="false" />
    </div>
    <div class="col-md-9">
      <router-outlet />
    </div>
  </div>
</div>
}
