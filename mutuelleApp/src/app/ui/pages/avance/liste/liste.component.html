<div class="container">
  <div class="d-flex justify-content-between">
    <h1 class="h3">Les avances</h1>
    <button class="btn btn-primary" type="button" (click)="add()">
      Ajouter une avance
    </button>
  </div>
  <hr />
  <div
    class="d-flex justify-content-center flex-wrap gap-2 mb-3 liste"
    *ngIf="avances$ | async as avances"
  >
    <app-card *ngFor="let avance of avances" [avance]="avance"></app-card>
    <h2 *ngIf="avances.length == 0" class="text-center">
      Aucune avance n'a été trouvé dans la base
    </h2>
  </div>
</div>
