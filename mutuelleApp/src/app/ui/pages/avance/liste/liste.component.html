<div class="container">
  <div class="d-flex justify-content-between">
    <h1 class="h3">Les avances</h1>
    <button class="btn btn-primary" type="button" (click)="add()">
      Ajouter une avance
    </button>
  </div>
  <hr />
  <div class="row" *ngIf="avances$ | async as avances">
    <div class="col-md-2 mb-3" *ngFor="let avance of avances">
      <app-card
        [avance]="avance"
        [membre]="getMembreById(avance.membreId)"
      ></app-card>
    </div>
    <div class="col" *ngIf="avances.length == 0">
      <h2 class="text-center">Aucune avance n'a été trouvé dans la base</h2>
    </div>
  </div>
</div>
