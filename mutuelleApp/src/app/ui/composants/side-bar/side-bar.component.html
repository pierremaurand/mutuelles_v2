<div class="d-flex flex-column flex-shrink-0">
  <a
    routerLink="/home"
    class="d-flex align-items-center mb-md-0 me-md-auto text-decoration-none"
  >
    <span class="fs-4">MEF</span>
  </a>
  <hr />
  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item">
      <a
        routerLink="/home"
        routerLinkActive="active"
        class="nav-link"
        aria-current="page"
      >
        <i class="fa-solid fa-house"></i>
        Accueil
      </a>
    </li>
    <li>
      <a routerLink="/membre" routerLinkActive="active" class="nav-link">
        <i class="fa-solid fa-users"></i>
        Membres
      </a>
    </li>
    <li>
      <a routerLink="/adhesion" routerLinkActive="active" class="nav-link">
        <i class="fa-solid fa-user-check"></i>
        Adhésions
      </a>
    </li>
    <li>
      <a routerLink="/cotisation" routerLinkActive="active" class="nav-link">
        <i class="fa-solid fa-coins"></i>
        Cotisations
      </a>
    </li>
    <li>
      <a routerLink="/avance" routerLinkActive="active" class="nav-link">
        <i class="fa-solid fa-users"></i>
        Avances
      </a>
    </li>
    <li>
      <a routerLink="/credit" routerLinkActive="active" class="nav-link">
        <i class="fa-solid fa-users"></i>
        Crédits
      </a>
    </li>
    <li>
      <a routerLink="/caisse" routerLinkActive="active" class="nav-link">
        <i class="fa-solid fa-users"></i>
        Caisse
      </a>
    </li>
    <li>
      <a routerLink="/utilisateur" routerLinkActive="active" class="nav-link">
        <i class="fa-solid fa-users"></i>
        Utilisateurs
      </a>
    </li>
    <li>
      <a routerLink="/agence" routerLinkActive="active" class="nav-link">
        <i class="fa-solid fa-building"></i>
        Agences
      </a>
    </li>
  </ul>
  <hr />
  <div class="dropdown" *ngIf="userInfos$ | async as user">
    <a
      href="#"
      class="d-flex align-items-center text-decoration-none dropdown-toggle"
      id="dropdownUser1"
      data-bs-toggle="dropdown"
      aria-expanded="false"
    >
      <img
        [src]="photo"
        alt=""
        width="32"
        height="32"
        class="rounded-circle me-2"
      />
      <strong>{{ user.login }}</strong>
    </a>
    <ul class="dropdown-menu text-small shadow" aria-labelledby="dropdownUser1">
      <li>
        <a class="dropdown-item" routerLink="/home/profile/{{ user.id }}"
          ><i class="fa-solid fa-address-card"></i> Profile</a
        >
      </li>
      <li><hr class="dropdown-divider" /></li>
      <li>
        <a routerLink="/auth/login" class="dropdown-item" (click)="logout()"
          ><i class="fa-solid fa-right-from-bracket"></i> Se déconnecté</a
        >
      </li>
    </ul>
  </div>
</div>
