<div class="d-flex flex-column flex-shrink-0 p-3">
  <a
    routerLink="/home"
    class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none"
  >
    <i class="fa-brands fa-bootstrap fs-1"></i>
    <span class="fs-4">Sidebar</span>
  </a>
  <hr />
  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item">
      <a
        routerLink="/home"
        routerLinkActive="active"
        class="nav-link"
        aria-current="page"
      >
        <i class="fa-solid fa-house"></i>
        Accueil
      </a>
    </li>
    <li>
      <a href="#" class="nav-link text-white">
        <svg class="bi me-2" width="16" height="16">
          <use xlink:href="#speedometer2" />
        </svg>
        Dashboard
      </a>
    </li>
    <li>
      <a href="#" class="nav-link text-white">
        <svg class="bi me-2" width="16" height="16">
          <use xlink:href="#table" />
        </svg>
        Orders
      </a>
    </li>
    <li>
      <a href="#" class="nav-link text-white">
        <svg class="bi me-2" width="16" height="16">
          <use xlink:href="#grid" />
        </svg>
        Products
      </a>
    </li>
    <li>
      <a href="#" class="nav-link text-white">
        <svg class="bi me-2" width="16" height="16">
          <use xlink:href="#people-circle" />
        </svg>
        Customers
      </a>
    </li>
  </ul>
  <hr />
  <div class="dropdown" *ngIf="userInfos$ | async as user">
    <a
      href="#"
      class="d-flex align-items-center text-decoration-none dropdown-toggle"
      id="dropdownUser1"
      data-bs-toggle="dropdown"
      aria-expanded="false"
    >
      <img
        [src]="photo"
        alt=""
        width="32"
        height="32"
        class="rounded-circle me-2"
      />
      <strong>{{ user.login }}</strong>
    </a>
    <ul class="dropdown-menu text-small shadow" aria-labelledby="dropdownUser1">
      <li>
        <a class="dropdown-item" routerLink="/home/profile"
          ><i class="fa-solid fa-address-card"></i> Profile</a
        >
      </li>
      <li><hr class="dropdown-divider" /></li>
      <li>
        <a routerLink="/auth/login" class="dropdown-item" (click)="logout()"
          ><i class="fa-solid fa-right-from-bracket"></i> Se déconnecté</a
        >
      </li>
    </ul>
  </div>
</div>
